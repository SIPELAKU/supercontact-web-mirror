# ============================================================
# GitLab CI/CD — Supercontact Web (Next.js + Vercel)
# ============================================================
#
# KAPAN PIPELINE INI JALAN?
#
#   ❌ Push ke dev         → TIDAK jalan (Vercel auto-deploy)
#   ❌ Push ke staging     → TIDAK jalan
#   ❌ Push ke main        → TIDAK jalan
#   ❌ Buka MR             → TIDAK jalan
#   ✅ Buat tag v1.5.0-rc.1 → JALAN → deploy ke STAGING
#   ✅ Buat tag v1.5.0      → JALAN → deploy ke PRODUCTION
#
# ALUR DEPLOYMENT:
#
#   [dev]     → Vercel auto-deploy setiap push
#               URL: solvera-supercontact-dev.vercel.app
#
#   [staging] → Lead merge dev→staging, lalu buat tag RC:
#               git tag -a v1.5.0-rc.1 -m "RC 1 - deskripsi"
#               git push origin v1.5.0-rc.1
#               → GitLab CI jalan → deploy via Vercel CLI
#               URL: solvera-supercontact-staging.vercel.app
#
#   [prod]    → Lead merge staging→main, lalu buat tag rilis:
#               git tag -a v1.5.0 -m "Release v1.5.0"
#               git push origin v1.5.0
#               → GitLab CI jalan → deploy via Vercel CLI
#               URL: solvera-supercontact.vercel.app
#
# PREREQUISITE (setup satu kali):
#
#   1. Vercel → Settings → General → Ignored Build Step:
#      if [[ "$VERCEL_GIT_COMMIT_REF" =~ ^(main|master|staging|prod)$ ]]; then exit 0; else exit 1; fi
#      (Agar Vercel SKIP auto-deploy untuk staging & main/prod,
#       tapi TETAP auto-deploy untuk dev & branch fitur)
#
#   2. GitLab → Settings → CI/CD → Variables:
#      - VERCEL_TOKEN      → https://vercel.com/account/tokens
#      - VERCEL_ORG_ID     → File .vercel/project.json → orgId
#      - VERCEL_PROJECT_ID → File .vercel/project.json → projectId
#
# BACKUP:
#   File asli disimpan di .gitlab-ci.yml.bak
#   Jika ada error, rename .bak kembali ke .gitlab-ci.yml
#
# ============================================================

# ---- Workflow: Kapan pipeline dibuat? ----
# Pipeline HANYA dibuat untuk:
#   1. Tag versi (v1.5.0, v1.5.0-rc.1) → deployment normal
#   2. Push ke staging/main             → hotfix urgent (oleh Lead)
#
# Push ke dev, feature/*, bugfix/* → TIDAK ada pipeline
# (ditambah auto [skip ci] via .githooks/prepare-commit-msg)
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/'
      when: always
    - if: '$CI_COMMIT_BRANCH =~ /^(staging|main|master)$/'
      when: always
    - when: never

# ---- Konfigurasi Global ----

image: node:20-alpine

# Caching untuk vercel CLI agar tidak install ulang setiap run
cache:
  key: vercel-cli
  paths:
    - /usr/local/lib/node_modules/vercel/

stages:
  - deploy

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

# ============================================================
# Deploy to STAGING (Vercel Preview)
# ============================================================
#
# Dipicu oleh tag RC: v1.5.0-rc.1, v1.5.0-rc.2, dst.
# Deploy ke: solvera-supercontact-staging.vercel.app
#
# Vercel CLI akan:
#   1. Pull env vars staging dari Vercel
#   2. Build Next.js (dengan env vars yang benar)
#   3. Deploy sebagai preview
#   4. Alias ke domain staging
# ============================================================
deploy_staging:
  stage: deploy
  environment:
    name: staging
    url: https://solvera-supercontact-staging.vercel.app
  script:
    - echo "🚀 Deploying to STAGING via Vercel..."
    - echo "   Tag     → $CI_COMMIT_TAG"
    - VERSION=$(node -p "require('./package.json').version")
    - echo "   Version → $VERSION"

    # Install Vercel CLI
    - npm i -g vercel

    # Pull konfigurasi Vercel project (env vars staging)
    - vercel pull --yes --environment=staging --token=$VERCEL_TOKEN

    # vercel build hanya baca .env.preview.local, jadi copy dari staging
    - cp .vercel/.env.staging.local .vercel/.env.preview.local

    # Build menggunakan Vercel (env variables dari Vercel ikut)
    - vercel build --token=$VERCEL_TOKEN

    # Deploy sebagai preview (staging)
    - DEPLOY_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN)
    - echo "Preview URL → $DEPLOY_URL"

    # Alias ke domain staging
    - vercel alias $DEPLOY_URL solvera-supercontact-staging.vercel.app --token=$VERCEL_TOKEN

    - echo ""
    - echo "✅ Staging deployment selesai!"
    - echo "   URL → https://solvera-supercontact-staging.vercel.app"
    - echo "   Tag → $CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/'

# ============================================================
# Deploy to PRODUCTION (Vercel Production)
# ============================================================
#
# Dipicu oleh tag rilis: v1.5.0, v2.0.0, dst.
# Deploy ke: solvera-supercontact.vercel.app
#
# Vercel CLI akan:
#   1. Pull env vars production dari Vercel
#   2. Build Next.js (dengan env vars production)
#   3. Deploy ke production
# ============================================================
deploy_prod:
  stage: deploy
  environment:
    name: production
    url: https://solvera-supercontact.vercel.app
  script:
    - echo "🟢 Deploying to PRODUCTION via Vercel..."
    - echo "   Tag     → $CI_COMMIT_TAG"
    - VERSION=$(node -p "require('./package.json').version")
    - echo "   Version → $VERSION"

    # Install Vercel CLI
    - npm i -g vercel

    # Pull konfigurasi Vercel project
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN

    # Build menggunakan Vercel (env variables dari Vercel ikut)
    - vercel build --prod --token=$VERCEL_TOKEN

    # Deploy ke production
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

    - echo ""
    - echo "✅ Production deployment selesai!"
    - echo "   URL → https://solvera-supercontact.vercel.app"
    - echo "   Tag → $CI_COMMIT_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  # Uncomment baris di bawah jika ingin manual approval sebelum deploy prod
  # when: manual
  # allow_failure: false
